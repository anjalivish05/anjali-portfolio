services:
  - type: web
    name: anjali-portfolio-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anjali-portfolio-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        value: anjali13anuj@gmail.com
      - key: SENDER_EMAIL
        value: "Portfolio Contact <onboarding@resend.dev>"
      - key: ALLOWED_ORIGINS
        value: "https://anjali-portfolio.vercel.app,http://localhost:5173"

databases:
  - name: anjali-portfolio-db
    plan: free
    region: oregon
